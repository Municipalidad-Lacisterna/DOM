name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Levantar base de datos y API
      run: |
        docker compose up -d db api
        
        echo "Esperando a que la API esté lista..."
        for i in {1..30}; do
          curl -s http://localhost:8001/health && break
          sleep 2
        done

    - name: Crear tablas y sembrar datos de prueba
      run: |
        docker compose exec -T api python -m app.create_tables
        docker compose exec -T api python -m app.seed

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias para el script de prueba
      run: |
        python -m pip install --upgrade pip
        pip install httpx

    - name: Ejecutar Suite E2E (28 pasos)
      run: |
        # El script por defecto busca http://api:8000 (red docker interna)
        # Como lo corremos desde el runner de GitHub (host), apuntamos al puerto expuesto
        sed -i 's/http:\/\/api:8000/http:\/\/localhost:8001/g' backend/test_e2e.py
        
        cd backend
        python test_e2e.py

    - name: Apagar servicios (Limpieza)
      if: always()
      run: docker compose down -v
