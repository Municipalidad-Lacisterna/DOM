# DOM en Línea Municipal — ambiente de desarrollo completo
# Uso:  docker compose up --build
# después (primera vez):  docker compose exec api python -m app.create_tables
#                         docker compose exec api python -m app.seed

services:
  db:
    image: postgres:16-alpine
    container_name: dom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dom_user
      POSTGRES_PASSWORD: dom_pass_2026
      POSTGRES_DB: dom_municipal
    ports:
      # Puerto alternativo: el bot Cisternin usa el 5432 del host
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dom_user -d dom_municipal"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dom_api
    restart: unless-stopped
    ports:
      # Puerto alternativo: el bot Cisternin usa el 8000 del host
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dom_user:dom_pass_2026@db:5432/dom_municipal
      DATABASE_URL_SYNC: postgresql://dom_user:dom_pass_2026@db:5432/dom_municipal
      SECRET_KEY: dom-secret-dev-change-me
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - ./backend/storage:/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dom_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Dentro de la red Docker la API se llama por su nombre de servicio
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/ciudadano.html:/app/ciudadano.html
      - ./frontend/vite.config.ts:/app/vite.config.ts

volumes:
  pgdata: